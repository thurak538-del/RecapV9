<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Video Splitter · Recap Studio</title>
<link rel="stylesheet" href="/css/style.css">
<style>
.split-page{max-width:1050px;margin:30px auto;padding:20px;color:var(--text-main)}.split-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.split-card{background:var(--bg-card);border:1px solid var(--border-light);border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 12px 36px #0001}.split-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.split-grid label{display:grid;gap:6px;color:var(--text-secondary);font-size:13px;font-weight:700}.split-grid input,.split-grid select{padding:11px;border-radius:9px;border:1px solid var(--border-light);background:var(--bg-input);color:var(--text-main)}.split-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.split-table{width:100%;border-collapse:collapse;margin-top:16px}.split-table th,.split-table td{padding:9px;text-align:left;border-bottom:1px solid var(--border-light);font-size:13px}.split-msg{min-height:22px;margin:10px 0;color:var(--text-secondary)}.split-files{padding:16px;border:1px dashed var(--border-light);border-radius:12px}.split-item{padding:8px 0;border-bottom:1px solid var(--border-light)}@media(max-width:650px){.split-grid{grid-template-columns:1fr}.split-head{align-items:flex-start;flex-direction:column}.split-table th,.split-table td{font-size:11px;padding:6px}}
.split-preview-stage{position:relative;width:min(100%,720px);aspect-ratio:16/9;margin:18px auto;background:#080b12;border-radius:12px;overflow:hidden;touch-action:none}.split-preview-stage video{width:100%;height:100%;object-fit:contain}.split-preview-text,.split-preview-label{position:absolute;color:white;font-weight:800;text-shadow:0 2px 5px #000,1px 1px #000;cursor:move;white-space:nowrap;user-select:none;touch-action:none}.split-preview-text{left:50%;top:82%;transform:translateX(-50%);font-size:clamp(14px,2.5vw,28px);padding:4px 8px;background:#0009;border-radius:4px}.split-preview-label{right:4%;top:4%;font-size:clamp(12px,2vw,21px)}
</style>
</head>
<body>
<main class="split-page">
<header class="split-head"><div><span class="bv-tool-kicker">VIDEO TOOLS</span><h1>Video Splitter</h1><p>ရှည်တဲ့ video ကို အပိုင်းခွဲပြီး Reels / TikTok / Facebook အတွက် ထုတ်ပါ။</p></div><a class="bv-secondary-3d-btn" href="/index.html">← Home</a></header>
<section class="split-card"><h2>၁။ Video ရွေးပါ</h2><div class="split-files"><input id="videos" type="file" accept="video/*" multiple><p>သို့မဟုတ် folder ရွေးပါ</p><input id="folder" type="file" accept="video/*" multiple webkitdirectory></div><div id="fileList"></div>
<div class="split-grid" style="margin-top:16px"><label>အပိုင်းတစ်ပိုင်း (မိနစ်) <input id="partMinutes" type="number" min="0.5" max="60" step="0.5" value="3"></label><label>Smart cut စောင့်ချိန် (စက္ကန့်) <input id="maxWait" type="number" min="0" max="120" value="20"></label></div><label class="bv-inline-control"><input id="smartCut" type="checkbox" checked> စကားရပ်/အသံတိတ်နားမှာ ဖြတ်ရန် (Smart cut)</label>
<div class="split-actions"><button class="bv-solid-btn bv-solid-bevel" id="planBtn">Check cuts</button></div><div class="split-msg" id="message"></div><div id="planTable"></div></section>
<section class="split-card"><h2>၂။ Ratio,စာနဲ့ Part နံပါတ်</h2><div class="split-grid"><label>Ratio<select id="ratio"><option>Original</option><option>16:9</option><option>9:16</option><option>1:1</option></select></label><label>Fill<select id="fill"><option value="blur-background">Blur background</option><option value="black-bars">Black bars</option><option value="crop-to-fill">Crop to fill</option></select></label><label>Text Box (အပိုင်းတိုင်း)<input id="overlayText" placeholder="စာသားထည့်ပါ (မဖြည့်လည်းရ)" maxlength="500"></label><label>Text size<input id="overlaySize" type="number" min="8" max="300" value="48"></label><label>Text opacity<input id="overlayOpacity" type="number" min="0" max="1" step="0.05" value="1"></label><label>Text position<select id="overlayPlacement"><option value="bottom">အောက်</option><option value="top">အပေါ်</option><option value="center">အလယ်</option></select></label><label>Part Number template<input id="partLabel" value="Part {n}/{total}"></label><label>Part label position<select id="labelPlacement"><option value="top-right">အပေါ်ညာ</option><option value="top-left">အပေါ်ဘယ်</option><option value="bottom-right">အောက်ညာ</option><option value="bottom-left">အောက်ဘယ်</option></select></label></div><label class="bv-inline-control"><input id="overlayBackground" type="checkbox" checked> Text box dark background</label><label class="bv-inline-control"><input id="showNumber" type="checkbox" checked> Part number ပြရန်</label>
<div id="splitPreviewStage" class="split-preview-stage"><video id="splitPreviewVideo" controls playsinline></video><div id="splitTextPreview" class="split-preview-text" draggable="true"></div><div id="splitLabelPreview" class="split-preview-label" draggable="true"></div></div>
<div class="split-actions"><button class="bv-solid-btn bv-solid-bevel" id="exportBtn" disabled>START / RESUME SPLIT</button><button id="stopBtn" class="bv-secondary-3d-btn" type="button" disabled>STOP SAFELY</button><a id="downloadLink" class="bv-secondary-3d-btn" hidden>⬇ Download parts ZIP</a></div></section>
</main>
<script src="/js/splitter.js"></script>
</body></html>
